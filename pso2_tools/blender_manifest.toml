schema_version = "1.0.0"
id = "pso2_tools"
version = "2.10.0"
name = "PSO2 Tools"
tagline = "PSO2 file format support"
maintainer = "dummycount"
type = "add-on"
tags = ["Import-Export"]
license = ["SPDX:GPL-2.0-or-later"]
blender_version_min = "4.4.0"
platforms = ["windows-x64", "macos-arm64"]
wheels = [
  "wheels/pycparser-3.11-py3-none-any.whl",
  "wheels/watchdog-6.0.0-cp313-cp313-macosx_11_0_arm64.whl",
  "wheels/cffi-2.1.1-cp311-cp311-macosx_11_0_arm64.whl",
  "wheels/watchdog-6.0.0-py3-none-win_amd64.whl",
  "wheels/cffi-2.1.1-cp311-cp311-win_amd64.whl",
  "wheels/clr_loader-0.2.10-py3-none-any.whl",
  "wheels/cffi-2.1.1-cp313-cp313-win_amd64.whl",
  "wheels/pythonnet-3.0.5-py3-none-any.whl",
  "wheels/cffi-2.1.1-cp313-cp313-macosx_11_0_arm64.whl",
  "wheels/watchdog-6.0.0-cp311-cp311-macosx_11_0_arm64.whl",
]

[build]
# bin/ is built for the host OS. build_package.py selects that platform
# and its wheels; build_bin.py removes legacy Windows native DLLs from
# Mac builds before recording the shipped assembly hashes.
#
# bin/x64/assimp.dll and bin/runtimes/win-x64/native/assimp.dll are the same
# 7.9 MB file byte for byte; the probing path in dotnet.py points at the
# first, so the second only inflates the package.
#
# bin/ is wiped and refilled by scripts/build_bin.py, so anything kept aside
# in there by hand is not part of the add-on either.
#
# Verified by importing an ICE archive and exporting it back to .aqp in a
# fresh Blender with all of these removed: same 39 meshes, same 11,559
# vertices, same .aqp out.
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
  "/bin/backup-*/",
  "/bin/runtimes/linux-*/",
  "/bin/runtimes/osx-*/",
  "/bin/runtimes/win-x86/",
  "/bin/runtimes/win-arm64/",
  "/bin/runtimes/win-x64/native/assimp.dll",
  "/bin/AquaModelLibrary.Native.X86.dll",
  "/bin/x86/",
]

[permissions]
files = "Import/export PSO2 model files"
